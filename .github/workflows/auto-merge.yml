name: Auto merge

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
  pull_request_review:
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Re-evaluate this pull request number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          event="$GITHUB_EVENT_PATH"
          number="${DISPATCH_PR_NUMBER:-}"
          if [[ -z "$number" ]]; then
            number="$(jq -r '.pull_request.number // .review.pull_request_url // .check_suite.pull_requests[0].number // empty' "$event")"
            if [[ "$number" == http* ]]; then number="${number##*/}"; fi
          fi
          if [[ -z "$number" ]]; then
            echo "対象 PR がないイベントなので終了します"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")"
          author="$(jq -r '.user.login' <<< "$pr")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<< "$pr")"
          draft="$(jq -r '.draft' <<< "$pr")"
          echo "number=$number" >> "$GITHUB_OUTPUT"

          # fork の token や第三者コードに書き込み権限を渡さないため、base と同じリポだけを対象にする。
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" || "$draft" == "true" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" >/dev/null 2>&1; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '.labels | any(.name == "automerge")' <<< "$pr" >/dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unsafe_path=""
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*|*keyserve*|*secrets*|*.env*|*fleet-command.json|*fleet-directives.json)
                unsafe_path="$file"
                break
                ;;
            esac
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100" --jq '.[].filename')

          if [[ -n "$unsafe_path" ]]; then
            message="🔒 kim の手動マージが必要(理由: $unsafe_path)"
            # 再評価イベントが多いため、同じ安全弁コメントは一度だけ残す。
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100" --jq '.[].body' | grep -Fqx "$message"; then
              gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body "$message"
            fi
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Enable squash auto-merge
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge --auto --squash --delete-branch --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
