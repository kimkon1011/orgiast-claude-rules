<!DOCTYPE html>
<html lang="ja"><head><base target="_top"><meta charset="utf-8">
<style>body{font-family:system-ui,sans-serif;background:#f3f5f8;color:#172b4d;margin:0;padding:20px}main{max-width:560px;margin:auto;background:white;padding:24px;border-radius:12px}h1{font-size:24px}label{display:block;margin:18px 0 6px;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #aeb9c7;border-radius:6px}button{margin-top:24px;background:#1255a0;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}small{display:block;color:#536277;margin:6px 0}#status{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:20px}textarea{min-height:110px}</style></head>
<body><main><h1>業者見積アップロード</h1><p>案件を選び、見積ファイルを送信してください。</p>
<form id="upload">
<label for="caseId">案件（必須）</label><select id="caseId" required><option value="">選択してください</option><? for (var i=0;i<cases.length;i++) { ?><option value="<?= cases[i].caseId ?>" <? if(cases[i].caseId === caseId){ ?>selected<? } ?>><?= cases[i].clientName ?> / <?= cases[i].caseName ?></option><? } ?></select>
<label for="vendor">業者名（必須）</label><input id="vendor" required maxlength="200" autocomplete="organization">
<label for="contact">担当者名（必須）</label><input id="contact" required maxlength="200" autocomplete="name">
<label for="email">メール（任意）</label><input id="email" type="email" maxlength="254" autocomplete="email">
<label for="files">見積ファイル（必須・複数可）</label><input id="files" type="file" multiple required accept=".pdf,.xlsx,.xls,.png,.jpg,.jpeg,.gif,.webp"><small>PDF・Excel・画像（PNG/JPEG/GIF/WebP）。1ファイル10MB・合計20MB、最大30件。</small>
<label for="memo">メモ（任意）</label><textarea id="memo" maxlength="4000"></textarea>
<button id="send" type="submit">送信する</button></form><div id="status" role="status" aria-live="polite"></div></main>
<script>
const form=document.getElementById('upload'),statusEl=document.getElementById('status'),button=document.getElementById('send');
function read(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,base64:String(reader.result).split(',')[1]});reader.onerror=()=>reject(new Error('ファイルを読み込めません: '+file.name));reader.readAsDataURL(file);});}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;statusEl.textContent='送信準備中…';try{
const files=Array.from(document.getElementById('files').files);
if(!files.length||files.length>30||files.some(f=>f.size===0||f.size>10*1024*1024)||files.reduce((n,f)=>n+f.size,0)>20*1024*1024)throw new Error('1ファイル10MB・合計20MB、1〜30件のファイルを選択してください。');
if(files.some(f=>!(/\.(pdf|xlsx|xls|png|jpe?g|gif|webp)$/i.test(f.name))))throw new Error('対応していないファイル形式です。');
const payload={};['caseId','vendor','contact','email','memo'].forEach(id=>payload[id]=document.getElementById(id).value);
payload.files=await Promise.all(files.map(read));statusEl.textContent='送信中…この画面を閉じずにお待ちください。';
google.script.run.withSuccessHandler(result=>{form.hidden=true;statusEl.textContent='受け付けました。\n受付番号: '+result.receiptId+'\nご提出ありがとうございます。';}).withFailureHandler(error=>{statusEl.textContent=error.message||'送信に失敗しました。';button.disabled=false;}).EstimateIntake_submit(payload);
}catch(error){statusEl.textContent=error.message;button.disabled=false;}});
</script></body></html>
