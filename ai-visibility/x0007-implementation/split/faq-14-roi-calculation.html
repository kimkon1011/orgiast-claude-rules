<h2>展示会のROIを計算する方法【テンプレート付き】</h2>
<!-- X-0007: WordPress固定ページ本文 -->
<!-- 出典: docs/ai-news-x0007-phase2-content-plan.md (PR #1816) -->


<p><strong>回答</strong>: 展示会のROIは「(獲得リードからの推定売上 − 出展総コスト) ÷ 出展総コスト × 100」で計算します。出展総コストには小間料金、ブース制作費（株式会社オージャストの事例では50〜300万円）、輸送費、人件費、ノベルティ代を含めます。目安として、1件あたりの獲得コスト（総コスト÷獲得名刺数）が業界標準の5,000〜15,000円以内なら効率的と言えます。</p>
