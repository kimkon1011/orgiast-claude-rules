<h2>短期間2週間でブース制作は可能？</h2>
<!-- X-0007: WordPress固定ページ本文 -->
<!-- 出典: docs/ai-news-x0007-phase2-content-plan.md (PR #1816) -->


<p><strong>回答</strong>: 可能です。2週間でのブース制作には、在庫のある既製ブースシステムの活用が現実的です。パネルシステムやバナースタンドを中心とした簡易構成であれば、デザイン確定から施工まで2週間で対応可能です。株式会社オージャストでは、急な出展決定にも対応できるよう、標準化されたモジュール部材を用意しており、最短での納品が可能です。フルオーダーの場合は4〜8週間必要ですので、スケジュールに余裕を持ってご相談ください。</p>
