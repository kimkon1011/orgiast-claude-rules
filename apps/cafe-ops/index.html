<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>212coffee 業務チェック</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #261b15; background: #f6f1ea; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100%, 640px); margin: 0 auto; padding: 20px 16px 40px; }
    h1 { margin: 0 0 16px; font-size: 1.45rem; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    button, input[type="file"] { font: inherit; }
    .tab, .submit { min-height: 48px; border: 0; border-radius: 10px; padding: 10px; font-weight: 700; }
    .tab { background: #e4d8ca; color: #3f3028; }
    .tab.active { background: #5d3825; color: white; }
    .item { margin-bottom: 12px; padding: 14px; border: 1px solid #dbcdbf; border-radius: 12px; background: white; }
    .check-row { display: flex; min-height: 44px; align-items: center; gap: 12px; cursor: pointer; }
    .check-row input { width: 24px; height: 24px; flex: 0 0 auto; }
    .badge { white-space: nowrap; padding: 3px 7px; border-radius: 999px; background: #fff0c7; font-size: .82rem; }
    .photo-input { display: block; width: 100%; min-height: 44px; margin-top: 10px; }
    .preview { display: none; width: 120px; height: 90px; margin-top: 8px; border-radius: 8px; object-fit: cover; }
    .error { min-height: 1.4em; margin: 6px 0 0; color: #b42318; font-size: .9rem; }
    .submit { width: 100%; margin-top: 8px; background: #29703b; color: white; }
    .submit:disabled { background: #aaa49e; cursor: not-allowed; }
    .notice, .result { margin: 12px 0 0; line-height: 1.6; }
    .notice { color: #665c55; font-size: .9rem; }
    .result { padding: 12px; border-radius: 8px; background: #e3f4e7; }
  </style>
</head>
<body>
  <main>
    <h1>212coffee 業務チェック</h1>
    <nav class="tabs" aria-label="チェックする時間帯"></nav>
    <section id="checklist"></section>
    <button id="submit" class="submit" type="button" disabled>送信する</button>
    <p id="notice" class="notice"></p>
    <div id="result" class="result" hidden aria-live="polite"></div>
  </main>

  <script type="module">
    import { CHECKLIST } from './checklist-data.mjs';
    import { attachPhoto, buildSubmission, canSubmit, createInitialState, toggleItem } from './app.mjs';

    const WEBHOOK_URL = '';
    const STORAGE_KEY = 'cafe-ops-submissions';
    const requiredMessage = 'この項目は写真が必須です。写真を撮ってからチェックしてください。';
    let activePart = 'open';
    let state = createInitialState();

    const tabs = document.querySelector('.tabs');
    const checklist = document.querySelector('#checklist');
    const submitButton = document.querySelector('#submit');
    const notice = document.querySelector('#notice');
    const result = document.querySelector('#result');

    notice.textContent = WEBHOOK_URL ? '' : '通知先が未設定のため保存のみ';

    for (const [part, section] of Object.entries(CHECKLIST)) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tab';
      button.textContent = section.label;
      button.addEventListener('click', () => {
        activePart = part;
        result.hidden = true;
        render();
      });
      tabs.append(button);
    }

    function render() {
      [...tabs.children].forEach((button, index) => {
        const part = Object.keys(CHECKLIST)[index];
        button.classList.toggle('active', part === activePart);
        button.setAttribute('aria-pressed', String(part === activePart));
      });
      checklist.replaceChildren();

      for (const item of CHECKLIST[activePart].items) {
        const current = state.items[item.id];
        const card = document.createElement('article');
        card.className = 'item';
        const row = document.createElement('label');
        row.className = 'check-row';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = current.checked;
        const label = document.createElement('span');
        label.textContent = item.label;
        row.append(checkbox, label);
        if (item.photoRequired) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '📷 写真必須';
          row.append(badge);
        }
        card.append(row);

        const error = document.createElement('p');
        error.className = 'error';
        error.setAttribute('aria-live', 'polite');
        checkbox.addEventListener('change', () => {
          const outcome = toggleItem(state, item.id, checkbox.checked);
          if (!outcome.ok) {
            checkbox.checked = false;
            error.textContent = requiredMessage;
            return;
          }
          state = outcome.state;
          error.textContent = '';
          updateSubmit();
        });

        if (item.photoRequired) {
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = 'image/*';
          fileInput.capture = 'environment';
          fileInput.className = 'photo-input';
          fileInput.setAttribute('aria-label', `${item.label}の写真`);
          const preview = document.createElement('img');
          preview.className = 'preview';
          preview.alt = `${item.label}の添付写真`;
          if (current.photo) {
            preview.src = current.photo;
            preview.style.display = 'block';
          }
          fileInput.addEventListener('change', () => {
            const file = fileInput.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.addEventListener('load', () => {
              state = attachPhoto(state, item.id, String(reader.result));
              preview.src = String(reader.result);
              preview.style.display = 'block';
              error.textContent = '';
              updateSubmit();
            });
            reader.readAsDataURL(file);
          });
          card.append(fileInput, preview);
        }
        card.append(error);
        checklist.append(card);
      }
      updateSubmit();
    }

    function updateSubmit() {
      submitButton.disabled = !canSubmit(state, activePart);
    }

    submitButton.addEventListener('click', () => {
      if (!canSubmit(state, activePart)) return;
      const submission = buildSubmission(state, activePart, new Date());
      let submissions = [];
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? '[]');
        if (Array.isArray(saved)) submissions = saved;
      } catch {
        // 壊れた保存値は使用せず、今回分から保存し直す。
      }
      submissions.push(submission);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(submissions));
      result.textContent = `送信しました。${CHECKLIST[activePart].label}：${submission.items.length}項目、写真${submission.photos}枚`;
      result.hidden = false;
    });

    render();
  </script>
</body>
</html>
