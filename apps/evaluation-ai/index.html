<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>評価制度 AI 自動化</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1100px, 100%); margin: auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: clamp(1.5rem, 4vw, 2.1rem); }
    h2 { font-size: 1.2rem; margin-top: 0; }
    h3 { font-size: 1rem; }
    .sub { margin: 0 0 20px; color: #5c667a; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .tab { flex: 1; min-height: 46px; border: 1px solid #b8c1d1; border-radius: 9px; background: white; font-weight: 700; }
    .tab.active { border-color: #315ac7; background: #315ac7; color: white; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card { margin-bottom: 16px; padding: 18px; border: 1px solid #dce1ea; border-radius: 12px; background: white; box-shadow: 0 2px 8px #15213b0d; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .form-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    input[type="text"], input[type="number"], textarea { min-height: 42px; padding: 8px 10px; border: 1px solid #aeb8c8; border-radius: 7px; }
    input[type="text"] { flex: 1; min-width: 130px; }
    input[type="number"] { width: 80px; }
    textarea { width: 100%; min-height: 110px; resize: vertical; }
    .primary, .secondary, .danger { min-height: 42px; padding: 8px 14px; border-radius: 7px; font-weight: 700; }
    .primary { border: 0; background: #315ac7; color: white; }
    .secondary { border: 1px solid #96a3b8; background: white; }
    .danger { border: 1px solid #d2a5a5; background: #fff5f5; color: #942727; }
    .edit-row { display: flex; gap: 7px; align-items: center; margin: 8px 0; }
    .edit-row input:first-child { flex: 1; }
    .hint, .status { color: #5c667a; font-size: .9rem; line-height: 1.5; }
    .status { min-height: 1.5em; }
    .score-card { overflow-x: auto; }
    .score-line { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(150px, 2fr); align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #edf0f4; }
    .radios { display: flex; gap: 9px; justify-content: flex-end; }
    .radios label { display: inline-flex; align-items: center; gap: 2px; min-height: 36px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #dce1ea; text-align: left; }
    th { background: #f7f8fb; }
    .table-wrap { overflow-x: auto; }
    .bar-row { display: grid; grid-template-columns: minmax(100px, 180px) 1fr 45px; gap: 10px; align-items: center; margin: 10px 0; }
    .bar-track { height: 22px; border-radius: 5px; background: #e7ebf2; overflow: hidden; }
    .bar { height: 100%; background: #4d79dc; }
    .empty { padding: 18px 0; color: #687286; }
    @media (max-width: 560px) { .score-line { grid-template-columns: 1fr; } .radios { justify-content: flex-start; } th, td { padding: 8px 5px; } }
  </style>
</head>
<body>
  <main>
    <h1>評価制度 AI 自動化</h1>
    <p class="sub">入力・加重スコア算出・統計を、この端末内だけで行います。</p>
    <nav class="tabs" aria-label="画面切り替え">
      <button class="tab active" data-tab="input" type="button">入力</button>
      <button class="tab" data-tab="list" type="button">一覧・集計</button>
      <button class="tab" data-tab="stats" type="button">統計</button>
    </nav>

    <section id="input" class="panel active">
      <div class="grid">
        <article class="card">
          <h2>スタッフ</h2>
          <form id="staff-form" class="form-row"><input id="staff-name" type="text" placeholder="例：佐藤" required><button class="primary">追加</button></form>
          <div id="staff-editor"></div>
        </article>
        <article class="card">
          <h2>評価基準</h2>
          <form id="criterion-form" class="form-row"><input id="criterion-name" type="text" placeholder="例：積極性" required><input id="criterion-weight" type="number" min="0.1" step="0.1" value="1" aria-label="重み" required><button class="primary">追加</button></form>
          <div id="criterion-editor"></div>
        </article>
      </div>
      <article class="card score-card">
        <h2>5段階評価</h2>
        <div id="score-inputs"></div>
      </article>
      <div class="grid">
        <article class="card">
          <h2>自然言語入力</h2>
          <p class="hint">ルールベース解析（AI連携は未設定）<br>例：田中: 積極性3, チームワーク 4</p>
          <textarea id="nl-text" placeholder="1行に1人分を入力"></textarea>
          <button id="nl-apply" class="primary" type="button">解析して反映</button>
          <p id="nl-status" class="status" aria-live="polite"></p>
        </article>
        <article class="card">
          <h2>スプレッドシート取り込み</h2>
          <p class="hint">1行目に「氏名」と登録済みの評価基準名を含む TSV / CSV を貼り付けてください。</p>
          <textarea id="sheet-text" placeholder="氏名&#9;積極性&#10;佐藤&#9;5"></textarea>
          <button id="sheet-apply" class="primary" type="button">貼り付け内容を反映</button>
          <p id="sheet-status" class="status" aria-live="polite"></p>
        </article>
      </div>
    </section>

    <section id="list" class="panel"><article class="card"><h2>スタッフ別集計</h2><div id="results"></div></article></section>
    <section id="stats" class="panel">
      <div class="grid"><article class="card"><h2>基準別平均</h2><div id="averages"></div></article><article class="card"><h2>等級分布</h2><div id="grades"></div></article></div>
      <article class="card"><h2>基準別ランキング</h2><div id="ranking"></div></article>
    </section>
  </main>
  <script type="module">
    import { calculateAllResults, calculateStatistics } from './eval-engine.mjs';
    import { importScoreTable } from './sheet-import.mjs';
    import { parse } from './nl-input.mjs';
    import { createStore } from './store.mjs';

    const store = createStore();
    const initial = { staff: [], criteria: [], evaluations: [] };
    let state = store.load(initial);
    if (!state || !Array.isArray(state.staff) || !Array.isArray(state.criteria) || !Array.isArray(state.evaluations)) state = initial;
    const id = (prefix) => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    const escape = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const scoreText = (score) => score === null ? '未評価' : score.toFixed(2);
    function saveAndRender() { store.save(state); renderAll(); }
    function evaluationFor(staffId, criterionId) { return state.evaluations.find((item) => item.staffId === staffId && item.criterionId === criterionId); }
    function setScore(staffId, criterionId, score) {
      state.evaluations = state.evaluations.filter((item) => !(item.staffId === staffId && item.criterionId === criterionId));
      state.evaluations.push({ staffId, criterionId, score });
    }
    function renderEditors() {
      document.querySelector('#staff-editor').innerHTML = state.staff.length ? state.staff.map((person) => `<div class="edit-row"><input data-staff-name="${person.id}" value="${escape(person.name)}" aria-label="スタッフ名"><button class="danger" data-delete-staff="${person.id}" type="button">削除</button></div>`).join('') : '<p class="empty">スタッフを追加してください。</p>';
      document.querySelector('#criterion-editor').innerHTML = state.criteria.length ? state.criteria.map((item) => `<div class="edit-row"><input data-criterion-name="${item.id}" value="${escape(item.name)}" aria-label="基準名"><input data-criterion-weight="${item.id}" type="number" min="0.1" step="0.1" value="${item.weight}" aria-label="重み"><button class="danger" data-delete-criterion="${item.id}" type="button">削除</button></div>`).join('') : '<p class="empty">評価基準を追加してください。</p>';
    }
    function renderScores() {
      const target = document.querySelector('#score-inputs');
      if (!state.staff.length || !state.criteria.length) { target.innerHTML = '<p class="empty">スタッフと評価基準を追加すると入力欄が表示されます。</p>'; return; }
      target.innerHTML = state.staff.map((person) => `<section><h3>${escape(person.name)}</h3>${state.criteria.map((criterion) => { const current = evaluationFor(person.id, criterion.id)?.score; return `<div class="score-line"><span>${escape(criterion.name)}（重み ${criterion.weight}）</span><span class="radios">${[1,2,3,4,5].map((score) => `<label><input type="radio" name="score-${person.id}-${criterion.id}" data-score="${person.id}|${criterion.id}|${score}" ${current === score ? 'checked' : ''}>${score}</label>`).join('')}</span></div>`; }).join('')}</section>`).join('');
    }
    function renderResults() {
      const results = calculateAllResults(state.staff, state.criteria, state.evaluations);
      document.querySelector('#results').innerHTML = results.length ? `<div class="table-wrap"><table><thead><tr><th>スタッフ</th><th>加重スコア</th><th>等級</th></tr></thead><tbody>${results.map((item) => `<tr><td>${escape(item.staffName)}</td><td>${scoreText(item.score)}</td><td>${item.grade ?? '—'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">スタッフが未登録です。</p>';
    }
    function renderStats() {
      const stats = calculateStatistics(state.staff, state.criteria, state.evaluations);
      document.querySelector('#averages').innerHTML = stats.criterionStats.length ? stats.criterionStats.map((item) => `<div class="bar-row"><span>${escape(item.criterionName)}</span><div class="bar-track"><div class="bar" style="width:${(item.average ?? 0) * 20}%"></div></div><strong>${item.average === null ? '—' : item.average.toFixed(2)}</strong></div>`).join('') : '<p class="empty">評価基準が未登録です。</p>';
      document.querySelector('#grades').innerHTML = `<div class="table-wrap"><table><thead><tr>${Object.keys(stats.gradeDistribution).map((grade) => `<th>${grade}</th>`).join('')}</tr></thead><tbody><tr>${Object.values(stats.gradeDistribution).map((count) => `<td>${count}人</td>`).join('')}</tr></tbody></table></div>`;
      document.querySelector('#ranking').innerHTML = stats.ranking.length ? `<ol>${stats.ranking.map((item) => `<li>${escape(item.criterionName)}：${item.average === null ? '未評価' : item.average.toFixed(2)}（${item.count}件）</li>`).join('')}</ol>` : '<p class="empty">評価基準が未登録です。</p>';
    }
    function renderAll() { renderEditors(); renderScores(); renderResults(); renderStats(); }

    document.querySelectorAll('.tab').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((item) => item.classList.toggle('active', item === button));
      document.querySelectorAll('.panel').forEach((panel) => panel.classList.toggle('active', panel.id === button.dataset.tab));
      renderAll();
    }));
    document.querySelector('#staff-form').addEventListener('submit', (event) => { event.preventDefault(); const input = document.querySelector('#staff-name'); const name = input.value.trim(); if (name) { state.staff.push({ id: id('staff'), name }); input.value = ''; saveAndRender(); } });
    document.querySelector('#criterion-form').addEventListener('submit', (event) => { event.preventDefault(); const nameInput = document.querySelector('#criterion-name'); const weightInput = document.querySelector('#criterion-weight'); const name = nameInput.value.trim(); const weight = Number(weightInput.value); if (name && weight > 0) { state.criteria.push({ id: id('criterion'), name, weight }); nameInput.value = ''; weightInput.value = '1'; saveAndRender(); } });
    document.querySelector('#input').addEventListener('change', (event) => {
      const target = event.target;
      if (target.dataset.score) { const [staffId, criterionId, score] = target.dataset.score.split('|'); setScore(staffId, criterionId, Number(score)); saveAndRender(); }
      if (target.dataset.staffName) { const person = state.staff.find((item) => item.id === target.dataset.staffName); if (person && target.value.trim()) { person.name = target.value.trim(); saveAndRender(); } }
      if (target.dataset.criterionName) { const item = state.criteria.find((criterion) => criterion.id === target.dataset.criterionName); if (item && target.value.trim()) { item.name = target.value.trim(); saveAndRender(); } }
      if (target.dataset.criterionWeight) { const item = state.criteria.find((criterion) => criterion.id === target.dataset.criterionWeight); if (item && Number(target.value) > 0) { item.weight = Number(target.value); saveAndRender(); } }
    });
    document.querySelector('#input').addEventListener('click', (event) => {
      const staffId = event.target.dataset.deleteStaff; const criterionId = event.target.dataset.deleteCriterion;
      if (staffId) { state.staff = state.staff.filter((item) => item.id !== staffId); state.evaluations = state.evaluations.filter((item) => item.staffId !== staffId); saveAndRender(); }
      if (criterionId) { state.criteria = state.criteria.filter((item) => item.id !== criterionId); state.evaluations = state.evaluations.filter((item) => item.criterionId !== criterionId); saveAndRender(); }
    });
    function applyNamedEntries(entries) {
      let applied = 0;
      for (const entry of entries) {
        let person = state.staff.find((item) => item.name === entry.staffName);
        if (!person) { person = { id: id('staff'), name: entry.staffName }; state.staff.push(person); }
        const criterion = state.criteria.find((item) => item.name === entry.criterionName || item.id === entry.criterionId);
        if (!criterion) continue;
        setScore(person.id, criterion.id, entry.score); applied += 1;
      }
      return applied;
    }
    document.querySelector('#nl-apply').addEventListener('click', async () => {
      const result = await parse(document.querySelector('#nl-text').value);
      const applied = applyNamedEntries(result.entries);
      document.querySelector('#nl-status').textContent = `${applied}件を反映、${result.errors.length + result.entries.length - applied}件を確認できませんでした。`;
      saveAndRender();
    });
    document.querySelector('#sheet-apply').addEventListener('click', () => {
      const result = importScoreTable(document.querySelector('#sheet-text').value, { criteria: state.criteria });
      const applied = applyNamedEntries(result.entries);
      const missing = result.missing.length ? ` 未検出列: ${result.missing.join(', ')}` : '';
      document.querySelector('#sheet-status').textContent = `${applied}件を反映、${result.skipped.length}セルをスキップしました。${missing}`;
      saveAndRender();
    });
    renderAll();
  </script>
</body>
</html>
