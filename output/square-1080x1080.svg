<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="8" fill="url(#accent)"/>
  <rect x="0" y="1072" width="1080" height="8" fill="url(#accent)"/>

  <!-- Decorative circles -->
  <circle cx="900" cy="200" r="200" fill="#e94560" opacity="0.08"/>
  <circle cx="200" cy="900" r="180" fill="#ff6b6b" opacity="0.05"/>

  <text x="540" y="300" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="56" font-weight="bold" fill="#ffffff" letter-spacing="3" text-anchor="middle">
