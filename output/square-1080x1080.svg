    <tspan x="540" dy="70" font-size="48">ビジネスアイデアピッチ</tspan>
  </text>

  <text x="540" y="480" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif" font-size="26" fill="#cccccc" text-anchor="middle">
