<!doctype html>
<html lang="ja">
  <head>
    <base target="_top" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, "Noto Sans JP", sans-serif;
        background: #f5f6f8;
        margin: 0;
        color: #263238;
      }
      main {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        padding: 9px;
        border: 1px solid #bbb;
        border-radius: 7px;
        margin: 3px;
      }
      button {
        background: #455a64;
        color: #fff;
      }
      .tabs button.on {
        background: #1565c0;
      }
      .card {
        background: #fff;
        padding: 12px;
        border-radius: 10px;
        margin: 8px 0;
        display: grid;
        grid-template-columns: 70px 1fr;
        gap: 7px;
      }
      .card textarea,
      .card input,
      .card select {
        width: 100%;
      }
      .actions {
        grid-column: 1/3;
      }
      .hidden {
        display: none;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        background: #fff;
      }
      th,
      td {
        padding: 8px;
        border: 1px solid #ddd;
        text-align: left;
      }
      a {
        color: #1565c0;
      }
      .editBadge {
        color: #e65100;
        font-size: 12px;
      }
      .editLog {
        white-space: pre-wrap;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>⚙ チェックリスト管理</h1>
      <div>
        <button onclick="showTemplates()">テンプレート</button>
        <button onclick="showProgress()">進捗</button>
        <button onclick="showRush()">緊急依頼</button>
      </div>
      <section id="templates">
        <p>
          役割追加: <input id="newRole" /><button onclick="addRole()">
            追加
          </button>
        </p>
        <div id="roles" class="tabs"></div>
        <div id="days" class="tabs"></div>
        <button onclick="addItem()">＋ 項目追加</button>
        <div id="items"></div>
      </section>
      <section id="progress" class="hidden">
        <select id="case">
          <option value="">全案件</option>
        </select>
        <button onclick="loadProgress()">表示</button>
        <div id="summary"></div>
      </section>
      <section id="rush" class="hidden">
        <select id="rushCase"><option value="">全案件</option></select>
        <button onclick="loadRush()">表示</button>
        <div id="rushRows"></div>
      </section>
    </main>
    <script>
      const TOKEN = "<?= adminToken ?>";
      let all = [],
        role = "",
        day = "",
        boot = {};
      const $ = (x) => document.getElementById(x);

      function call(n, a, cb) {
        google.script.run
          .withSuccessHandler((r) => (r.ok ? cb(r) : alert(r.error)))
          .withFailureHandler((e) => alert(e.message || e))
          [n](...a);
      }

      function tabs(id, vals, key) {
        $(id).innerHTML = "";
        vals.forEach((v) => {
          let b = document.createElement("button");
          b.textContent = v;
          b.className = v === (key === "role" ? role : day) ? "on" : "";
          b.onclick = () => {
            if (key === "role") role = v;
            else day = v;
            renderTabs();
          };
          $(id).appendChild(b);
        });
      }

      function renderTabs() {
        let roles = [...new Set(all.map((i) => i.role))];
        if (!role) role = roles[0] || "";
        if (!day) day = boot.days[0];
        tabs("roles", roles, "role");
        tabs("days", boot.days, "day");
        renderItems();
      }

      function renderItems() {
        $("items").innerHTML = "";
        all
          .filter((i) => i.role === role && i.day === day)
          .sort((a, b) => a.order - b.order)
          .forEach((i, idx, arr) => {
            let d = document.createElement("div");
            d.className = "card";
            d.innerHTML = `<b>項目</b><input data-k="title" value="${esc(i.title)}"><b>補足</b><textarea data-k="detail">${esc(i.detail)}</textarea><b>種類</b><select data-k="type">${["check", "photo", "link", "vehicle_doc"].map((x) => `<option ${x === i.type ? "selected" : ""}>${x}</option>`)}</select><b>URL</b><textarea data-k="url">${esc(i.url)}</textarea><b>設定</b><label><input data-k="required" type="checkbox" ${i.required ? "checked" : ""}>必須　<input data-k="active" type="checkbox" ${i.active ? "checked" : ""}>表示</label><div class="actions"><button>保存</button><button>↑</button><button>↓</button><button>非表示</button></div>`;
            let bs = d.querySelectorAll("button");
            bs[0].onclick = () => save(i, d);
            bs[1].onclick = () => move(arr, idx, -1);
            bs[2].onclick = () => move(arr, idx, 1);
            bs[3].onclick = () => {
              if (!confirm("この項目を非表示にしますか？")) return;
              i.active = false;
              save(i, d);
            };
            $("items").appendChild(d);
          });
      }

      function save(i, d) {
        d.querySelectorAll("[data-k]").forEach(
          (x) => (i[x.dataset.k] = x.type === "checkbox" ? x.checked : x.value),
        );
        call("Checklist_adminUpsert", [TOKEN, i], load);
      }

      function move(arr, idx, delta) {
        let j = idx + delta;
        if (j < 0 || j >= arr.length) return;
        [arr[idx], arr[j]] = [arr[j], arr[idx]];
        call("Checklist_adminReorder", [TOKEN, arr.map((x) => x.id)], load);
      }

      function addItem() {
        call(
          "Checklist_adminUpsert",
          [
            TOKEN,
            {
              role,
              day,
              order: 999,
              title: "新しい項目",
              detail: "",
              type: "check",
              url: "",
              required: false,
              active: true,
            },
          ],
          load,
        );
      }

      function addRole() {
        let r = $("newRole").value.trim();
        if (!r) return;
        role = r;
        day = boot.days[0];
        call(
          "Checklist_adminUpsert",
          [
            TOKEN,
            {
              role: r,
              day: day,
              order: 1,
              title: "新しい項目",
              detail: "",
              type: "check",
              url: "",
              required: false,
              active: true,
            },
          ],
          load,
        );
      }

      function load() {
        call("Checklist_adminList", [TOKEN], (r) => {
          all = r.items;
          boot.days = r.days;
          renderTabs();
        });
      }

      function showTemplates() {
        $("templates").classList.remove("hidden");
        $("progress").classList.add("hidden");
        $("rush").classList.add("hidden");
      }

      function showProgress() {
        $("templates").classList.add("hidden");
        $("progress").classList.remove("hidden");
        $("rush").classList.add("hidden");
        loadProgress();
      }

      function showRush() {
        $("templates").classList.add("hidden");
        $("progress").classList.add("hidden");
        $("rush").classList.remove("hidden");
        loadRush();
      }

      function loadRush() {
        call("Checklist_listRush", [$("rushCase").value], (r) => {
          let options = ["new", "対応中", "出荷済", "到着", "取消"];
          $("rushRows").innerHTML = "<table><tr><th>案件</th><th>氏名</th><th>アイテム</th><th>数量</th><th>必要時刻</th><th>届け先</th><th>備考</th><th>状態</th><th>送信時刻</th><th>写真</th></tr>" + r.rows.map((x) => `<tr><td>${esc(x.caseName)}${x.editLog ? `<details><summary class="editBadge">✏️編集あり</summary><div class="editLog">${esc(x.editLog)}</div></details>` : ""}</td><td>${esc(x.staffName)} (${esc(x.role)})</td><td>${esc(x.itemName)}</td><td>${esc(x.quantity)}</td><td>${esc(x.neededTime)}</td><td>${esc(x.destination)}</td><td>${esc(x.notes)}</td><td><select data-rush-id="${esc(x.id)}">${options.map((s) => `<option ${s === x.status ? "selected" : ""}>${s}</option>`).join("")}</select></td><td>${esc(x.timestamp)}</td><td>${isWebUrl(x.photoUrl) ? `<a href="${esc(x.photoUrl)}" target="_blank">写真</a>` : ""}</td></tr>`).join("") + "</table>";
          $("rushRows").querySelectorAll("[data-rush-id]").forEach((select) => { select.onchange = () => call("Checklist_updateRushStatus", [select.dataset.rushId, select.value, "管理画面"], () => loadRush()); });
        });
      }

      function isWebUrl(url) {
        return (function (u) { u = String(u || "").toLowerCase(); return u.indexOf("http:") === 0 || u.indexOf("https:") === 0; })(url);
      }

      function loadProgress() {
        call(
          "Checklist_adminProgressSummary",
          [TOKEN, $("case").value],
          (r) => {
            $("summary").innerHTML =
              "<table><tr><th>案件</th><th>氏名</th><th>役割/日程</th><th>項目</th><th>状態</th><th>写真</th></tr>" +
              r.rows
                .map(
                  (x) =>
                    `<tr><td>${esc(x.caseLabel)}</td><td>${esc(x.staffName)}</td><td>${esc(x.role)} / ${esc(x.day)}</td><td>${esc(x.title)}</td><td>${esc(x.status)}</td><td>${x.photoUrls
                      .filter(isWebUrl)
                      .map(
                        (u, i) =>
                          `<a href="${esc(u)}" target="_blank">写真${i + 1}</a>`,
                      )
                      .join(" ")}</td></tr>`,
                )
                .join("") +
              "</table>";
          },
        );
      }

      function esc(s) {
        let d = document.createElement("div");
        d.textContent = s || "";
        return d.innerHTML;
      }
      call("Checklist_bootstrap", [], (r) => {
        boot = r;
        r.cases.forEach((c) => $("case").add(new Option(c.label, c.caseId)));
        r.cases.forEach((c) => $("rushCase").add(new Option(c.label, c.caseId)));
        load();
      });
    </script>
  </body>
</html>
