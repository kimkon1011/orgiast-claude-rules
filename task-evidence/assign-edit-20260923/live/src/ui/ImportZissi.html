<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: -apple-system, "Segoe UI", "Noto Sans JP", sans-serif; margin: 0; padding: 16px; font-size: 13px; color: #202124; }
    h2 { font-size: 14px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #5f6368; margin: 8px 0 4px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    button { padding: 8px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
    button.primary { background: #1a73e8; color: #fff; }
    button.primary:hover { background: #1557b0; }
    button.secondary { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
    button.secondary:hover { background: #f1f7ff; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin-top: 12px; padding: 8px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; }
    .status.ok { background: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
    .status.err { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6c0; }
    .status.run { background: #fef7e0; color: #b06000; border: 1px solid #fde293; }
    .preview { background: #f1f3f4; padding: 10px; border-radius: 4px; margin-top: 10px; font-size: 12px; }
    .preview .row { display: flex; justify-content: space-between; margin: 2px 0; }
    .preview .label { color: #5f6368; }
    .hint { font-size: 11px; color: #5f6368; margin-top: 4px; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h2>既存の実施計画書を案件一覧に取り込む</h2>

  <label>実施計画書の URL または Sheet ID</label>
  <input type="text" id="url" placeholder="https:&#x2f;&#x2f;docs.google.com/spreadsheets/d/.../edit">
  <div class="hint">summary シートの D5 / D13 / D19 から自動抽出します。</div>

  <div class="actions">
    <button class="secondary" id="btn-preview" onclick="doPreview()">プレビュー</button>
    <button class="primary" id="btn-submit" onclick="doSubmit()" disabled>取り込む</button>
  </div>

  <div id="preview" style="display:none;" class="preview"></div>

  <div id="status"></div>

  <label style="margin-top:16px; border-top:1px solid #eee; padding-top:12px;">上書き入力（自動抽出を上書きしたい場合のみ）</label>
  <label>クライアント名</label><input type="text" id="ov-client">
  <label>案件名</label><input type="text" id="ov-case">
  <label>開催開始日 (yyyy/MM/dd)</label><input type="text" id="ov-start">
  <label>開催終了日 (yyyy/MM/dd)</label><input type="text" id="ov-end">
  <label>ブースサイズ</label><input type="text" id="ov-booth">

  <script>
    let lastExtracted = null;
    let lastUrl = '';

    function doPreview() {
      const url = document.getElementById('url').value.trim();
      if (!url) { setStatus('URL を入力してください。', 'err'); return; }
      lastUrl = url;
      setStatus('読み込み中…', 'run');
      document.getElementById('btn-preview').disabled = true;
      google.script.run
        .withSuccessHandler(onPreview)
        .withFailureHandler(onError)
        ._CaseList_previewZissi(url);
    }

    function onPreview(res) {
      document.getElementById('btn-preview').disabled = false;
      if (res.duplicate) {
        setStatus('既に登録済み: ' + res.caseId, 'err');
        return;
      }
      lastExtracted = res.extracted;
      const div = document.getElementById('preview');
      div.style.display = 'block';
      div.innerHTML =
        '<div class="row"><span class="label">クライアント名</span><span>' + esc(res.extracted.clientName || '(取得不可)') + '</span></div>' +
        '<div class="row"><span class="label">案件名</span><span>' + esc(res.extracted.caseName || '(取得不可)') + '</span></div>' +
        '<div class="row"><span class="label">開催開始日</span><span>' + esc(res.extracted.startDate || '(取得不可)') + '</span></div>' +
        '<div class="row"><span class="label">親フォルダID</span><span>' + esc(res.projectFolderId || '(取得不可)') + '</span></div>' +
        '<div class="row"><span class="label">Sheet 名</span><span>' + esc(res.zissiName) + '</span></div>';
      document.getElementById('btn-submit').disabled = false;
      document.getElementById('ov-client').value = res.extracted.clientName || '';
      document.getElementById('ov-case').value = res.extracted.caseName || '';
      document.getElementById('ov-start').value = res.extracted.startDate || '';
      setStatus('プレビュー完了。必要なら上書きしてから「取り込む」を押してください。', 'ok');
    }

    function doSubmit() {
      if (!lastUrl) { setStatus('先にプレビューしてください。', 'err'); return; }
      const override = {
        clientName: document.getElementById('ov-client').value.trim(),
        caseName: document.getElementById('ov-case').value.trim(),
        startDate: document.getElementById('ov-start').value.trim(),
        endDate: document.getElementById('ov-end').value.trim(),
        boothSize: document.getElementById('ov-booth').value.trim()
      };
      setStatus('登録中…', 'run');
      document.getElementById('btn-submit').disabled = true;
      google.script.run
        .withSuccessHandler(onSubmit)
        .withFailureHandler(onError)
        .CaseList_importFromZissiUrl(lastUrl, override);
    }

    function onSubmit(res) {
      if (res.duplicate) {
        setStatus('既に登録済み: ' + res.caseId, 'err');
        return;
      }
      setStatus('案件 ' + res.caseId + ' として登録しました。\n'
        + '実施計画: ' + (res.zissiUrl ? '<a target="_blank" href="'+res.zissiUrl+'">'+res.zissiUrl+'</a>' : '(URL なし)') + '\n'
        + '案件フォルダ: ' + (res.caseFolderUrl ? '<a target="_blank" href="'+res.caseFolderUrl+'">'+res.caseFolderUrl+'</a>' : '(なし)') + '\n'
        + 'フェーズ: ' + res.used.phase, 'ok');
    }

    function onError(e) {
      document.getElementById('btn-preview').disabled = false;
      document.getElementById('btn-submit').disabled = false;
      setStatus('エラー: ' + (e.message || e), 'err');
    }

    function setStatus(html, kind) {
      const s = document.getElementById('status');
      s.innerHTML = html;
      s.className = 'status ' + (kind || '');
    }

    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
