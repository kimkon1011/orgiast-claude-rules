<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: -apple-system, "Segoe UI", "Noto Sans JP", sans-serif; margin: 0; padding: 16px; font-size: 13px; color: #202124; }
    h2 { font-size: 14px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: #5f6368; margin: 10px 0 4px; font-weight: bold; }
    select, input[type=file] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .hint { font-size: 11px; color: #5f6368; margin-top: 4px; }
    .preview { background: #f1f3f4; padding: 10px; border-radius: 4px; margin-top: 10px; font-size: 12px; max-height: 180px; overflow-y: auto; }
    .preview .row { padding: 4px 0; border-bottom: 1px dashed #ddd; }
    .preview .row:last-child { border-bottom: none; }
    .preview .original { color: #5f6368; text-decoration: line-through; font-size: 11px; }
    .preview .final { color: #1e8e3e; font-weight: bold; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    button { padding: 8px 14px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
    button.primary { background: #1a73e8; color: #fff; }
    button.primary:hover { background: #1557b0; }
    button.secondary { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin-top: 12px; padding: 8px; border-radius: 4px; font-size: 12px; white-space: pre-wrap; }
    .status.ok { background: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
    .status.err { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6c0; }
    .status.run { background: #fef7e0; color: #b06000; border: 1px solid #fde293; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h2>預かり素材アップロード</h2>

  <label>① 案件を選択</label>
  <select id="casePicker"><option value="">(読み込み中…)</option></select>

  <label>② 分類 (ファイル名プレフィックス)</label>
  <select id="prefix"></select>
  <div class="hint">選んだ分類が全ファイル名の先頭に自動で付きます (例: 出展マニュアル_xxx.pdf)</div>

  <label>③ ファイル選択 (複数可)</label>
  <input type="file" id="files" multiple onchange="renderPreview()">
  <div class="hint">合計 50MB 程度まで推奨。1ファイル 32MB 超は失敗します。</div>

  <div id="preview" style="display:none;" class="preview"></div>

  <div class="actions">
    <button class="primary" id="btn-upload" onclick="doUpload()" disabled>アップロード</button>
    <button class="secondary" onclick="google.script.host.close()">キャンセル</button>
  </div>

  <div id="status"></div>

  <script>
    let cases = [];
    let prefixOptions = [];

    google.script.run.withSuccessHandler(onCasesLoaded).withFailureHandler(onError).CaseList_listAll();
    google.script.run.withSuccessHandler(onPrefixesLoaded).withFailureHandler(onError).Upload_getPrefixOptions();

    function onCasesLoaded(list) {
      cases = list || [];
      const sel = document.getElementById('casePicker');
      if (cases.length === 0) {
        sel.innerHTML = '<option value="">(案件がありません)</option>';
        return;
      }
      sel.innerHTML = '<option value="">— 選択してください —</option>' +
        cases.map(c => '<option value="' + esc(c.caseId) + '">' +
          esc(c.caseId) + ' / ' + esc(c.clientName) + ' / ' + esc(c.caseName) + '</option>').join('');
    }

    function onPrefixesLoaded(opts) {
      prefixOptions = opts || [];
      const sel = document.getElementById('prefix');
      sel.innerHTML = prefixOptions.map(o => '<option value="' + esc(o.value) + '">' + esc(o.value) + ' — ' + esc(o.label) + '</option>').join('');
      renderPreview();
    }

    function renderPreview() {
      const filesInput = document.getElementById('files');
      const prefix = document.getElementById('prefix').value;
      const div = document.getElementById('preview');
      const btn = document.getElementById('btn-upload');
      if (!filesInput.files || filesInput.files.length === 0) {
        div.style.display = 'none';
        btn.disabled = true;
        return;
      }
      const validPrefixes = prefixOptions.map(o => o.value);
      let html = '';
      for (let i = 0; i < filesInput.files.length; i++) {
        let name = filesInput.files[i].name;
        validPrefixes.forEach(p => { if (name.indexOf(p) === 0) name = name.slice(p.length); });
        const finalName = prefix + name;
        const mb = (filesInput.files[i].size / 1024 / 1024).toFixed(2);
        html += '<div class="row">' +
          '<div class="original">' + esc(filesInput.files[i].name) + ' (' + mb + ' MB)</div>' +
          '<div class="final">→ ' + esc(finalName) + '</div></div>';
      }
      div.innerHTML = html;
      div.style.display = 'block';
      btn.disabled = false;
    }

    function doUpload() {
      const caseId = document.getElementById('casePicker').value;
      const prefix = document.getElementById('prefix').value;
      const filesInput = document.getElementById('files');
      if (!caseId) { setStatus('案件を選択してください。', 'err'); return; }
      if (!prefix) { setStatus('分類を選択してください。', 'err'); return; }
      if (!filesInput.files || filesInput.files.length === 0) { setStatus('ファイルを選択してください。', 'err'); return; }

      setStatus('読み込み中…', 'run');
      document.getElementById('btn-upload').disabled = true;

      const fileObjs = [];
      let pending = filesInput.files.length;
      for (let i = 0; i < filesInput.files.length; i++) {
        const file = filesInput.files[i];
        const reader = new FileReader();
        reader.onload = function(e) {
          // readAsDataURL は base64 を直接返すので大ファイル (>5MB) でもスタック爆発しない
          const result = e.target.result || '';
          const commaIdx = result.indexOf(',');
          const b64 = commaIdx >= 0 ? result.slice(commaIdx + 1) : '';
          fileObjs.push({ name: file.name, base64: b64, mimeType: file.type || 'application/octet-stream' });
          pending--;
          if (pending === 0) submitToBackend(caseId, prefix, fileObjs);
        };
        reader.onerror = function() {
          pending--;
          if (pending === 0) submitToBackend(caseId, prefix, fileObjs);
        };
        reader.readAsDataURL(file);
      }
    }

    function submitToBackend(caseId, prefix, files) {
      setStatus('アップロード中… (' + files.length + ' ファイル)', 'run');
      google.script.run
        .withSuccessHandler(onUploaded)
        .withFailureHandler(onError)
        .Upload_saveToAzukari(caseId, prefix, files);
    }

    function onUploaded(res) {
      document.getElementById('btn-upload').disabled = false;
      let html = '保存しました (' + res.savedFiles.length + ' 件)\n';
      html += '<a href="' + res.folderUrl + '" target="_blank">預かり素材フォルダを開く</a>\n\n';
      res.savedFiles.forEach(f => {
        html += '✓ ' + esc(f.finalName) + '\n';
      });
      if (res.errors && res.errors.length > 0) {
        html += '\n失敗:\n' + res.errors.map(e => '✗ ' + esc(e.name) + ': ' + esc(e.error)).join('\n');
      }
      setStatus(html, 'ok');
      // ファイル選択をクリア
      document.getElementById('files').value = '';
      renderPreview();
    }

    function onError(e) {
      document.getElementById('btn-upload').disabled = false;
      setStatus('エラー: ' + (e.message || e), 'err');
    }

    function setStatus(html, kind) {
      const s = document.getElementById('status');
      s.innerHTML = html;
      s.className = 'status ' + (kind || '');
    }

    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
